<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>godot-demo</title>
    <style>
      * { margin: 0; padding: 0; border: 0; }
      html { width: 100dvw; height: 100dvh; overflow: hidden; }
      body, .app { width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      body, .app { background-color: black; outline: none; }
      canvas.app { image-rendering: pixelated; }
      figure.app { background-position: 50% calc(50% + 0.5 * env(safe-area-inset-top, 0)); background-size: 128px; background-repeat: no-repeat; position: absolute; top: 0; left: 0; bottom: 0; right: 0; }
    </style>
  </head>
  <body>
    <canvas class="app" id="canvas" onclick="window.focus()" oncontextmenu="event.preventDefault()" ongesturestart="event.preventDefault()" tabindex="-1"></canvas>
    <figure class="app" id="splash"></figure>
    <script type="module">
      const splash = document.getElementById('splash');
      splash.style.backgroundImage = `url('${document.querySelector("link[rel*='icon']").href}')`;
      await import('./src/index.ts');
      splash.ontransitionend = () => splash.parentNode?.removeChild(splash);
      splash.style['transition'] = 'opacity 0.5s ease-in';
      splash.style['opacity'] = '0';
    </script>
  </body>
</html>
